[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "abdurrehmanshah1005", email = "abdurrehmanshah1005@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "minio>=7.2.20",
    "pandas<3",
    "polars>=1.44.1",
    "psycopg[binary]>=3.3.4",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "setuptools<81",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
    "ydata-profiling>=4.18.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""


